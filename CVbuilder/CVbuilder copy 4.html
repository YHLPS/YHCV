<!DOCTYPE html>
<html lang="he" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>קורות חיים מקצועיים - יותם חסין</title>
    <script src="https://cdn.jsdelivr.net/npm/docx@9.5.1/dist/index.iife.min.js"></script>
    <script src="https://unpkg.com/file-saver@2.0.5/dist/FileSaver.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
        }

        button {
            padding: 12px 24px;
            font-size: 18px;
            cursor: pointer;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
        }

        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>

<body>

    <h1>לחץ על הכפתור כדי ליצור קובץ קורות חיים משופר</h1>
    <button id="generateCVButton">צור קובץ DOCX</button>

    <script>
        const { Document, Packer, Paragraph, TextRun, HeadingLevel, AlignmentType, Spacing, BorderStyle } = docx;

        async function createCV() {
            const mainTitle = [
                new Paragraph({
                    text: "יותם חסין",
                    alignment: AlignmentType.CENTER,
                    heading: HeadingLevel.TITLE,
                }),
                new Paragraph({
                    text: "מפתח Full-Stack | .NET | React | Node.js",
                    alignment: AlignmentType.CENTER,
                    spacing: { after: 150 },
                })
            ];

            const doc = new Document({
                bidirectional: true,
                rightToLeft: true,
                sections: [
                    {
                        children: [
                            // כותרת ראשית: שם
                            ...mainTitle,

                            // פרטי יצירת קשר
                            new Paragraph({
                                bidirectional: true,
                                alignment: AlignmentType.CENTER,
                                rightToLeft: true,
                                children: [
                                    new TextRun({ text: "טלפון: 050-4030944 ", bold: true, rightToLeft: true, }),
                                    new TextRun(" | "),
                                    new TextRun({ text: `דוא"ל: yotamhassin@gmail.com `, bold: true, rightToLeft: true, }),
                                    new TextRun(" | "),
                                    new TextRun({ text: "אתר: ", bold: true, rightToLeft: true, }),
                                    new TextRun({ text: "https://yhlps.github.io/YHCV", link: "https://yhlps.github.io/YHCV/", rightToLeft: true, }),
                                ],
                                //spacing: { after: 300 },
                            }),

                            // פרופיל מקצועי
                            new Paragraph({
                                text: "פרופיל מקצועי",
                                heading: HeadingLevel.HEADING_2,
                                border: { bottom: { size: 12, value: "auto", color: "000000" } },
                                spacing: { before: 200, after: 100 },
                            }),
                            new Paragraph({
                                text: "מפתח Full-Stack מנוסה עם מעל עשור של ניסיון בבניית מערכות אינטרנט מקצה לקצה. מומחה בפיתוח צד-לקוח (React, Angular) ובצד-שרת (.NET, Node.js). מביא איתו יכולת למידה מהירה, פתרון בעיות מורכבות ומחויבות גבוהה לאיכות קוד ולארכיטקטורה יעילה. ניסיון רב בעבודה בצוותים פיתוח עם יכולות תקשורת מצויינות.",
                                spacing: { after: 300 },
                            }),

                            // ניסיון תעסוקתי
                            new Paragraph({
                                text: "ניסיון תעסוקתי",
                                heading: HeadingLevel.HEADING_2,
                                border: { bottom: { size: 12, value: "auto", color: "000000" } },
                                spacing: { before: 200, after: 100 },
                            }),
                            new Paragraph({
                                text: "מפתח Full-Stack | חברת 365Scores | 2021-2022",
                                bold: true,
                            }),
                            new Paragraph({
                                text: "פיתוח עם React, Redux ופיתוח מונחה קומפוננטות (CDD). עבודה מול שרת .Net Core בארכיטקטורת MVC ושימוש ב-APIControllers.",
                                bullet: { level: 0 },
                                spacing: { after: 200 },
                            }),
                            new Paragraph({
                                text: "מפתח עצמאי (פרילאנס) | 2017-2021",
                                bold: true,
                            }),
                            new Paragraph({
                                text: "פיתוח מערכות אינטרנט מלאות מקצה לקצה, כולל עבודה מול מעצבים (Client-side) ומנהלי בסיסי נתונים (Server-side).",
                                bullet: { level: 0 },
                                spacing: { after: 200 },
                            }),
                            new Paragraph({
                                text: `מפתח Client | חברת "מטריקס" | 2016-2017`,
                                bold: true,
                            }),
                            new Paragraph({
                                text: "פיתוח עבור רשות התקשוב הממשלתי (ממשל זמין) באמצעות Angular, React, HTML5, TypeScript, JavaScript ו-CSS3.",
                                bullet: { level: 0 },
                                spacing: { after: 200 },
                            }),
                            new Paragraph({
                                text: `מפתח .NET | חברת "אלעד מערכות" | 2015-2016`,
                                bold: true,
                            }),
                            new Paragraph({
                                text: "פיתוח עבור רשות מקרקעי ישראל ומשרד החינוך. שימוש בטכנולוגיות ASP.Net MVC5, Entity Framework, AngularJS, jQuery.",
                                bullet: { level: 0 },
                                spacing: { after: 200 },
                            }),
                            new Paragraph({
                                text: `מתכנת Full Stack .NET | 2014-2015`,
                                bold: true,
                            }),
                            new Paragraph({
                                text: "פיתוח מערכת עבור מעל ל-10,000 לקוחות וביצוע עבודות פרילאנס בתכנות .NET.",
                                bullet: { level: 0 },
                                spacing: { after: 300 },
                            }),

                            // כישורים טכניים
                            new Paragraph({
                                text: "כישורים טכניים",
                                heading: HeadingLevel.HEADING_2,
                                border: { bottom: { size: 12, value: "auto", color: "000000" } },
                                spacing: { before: 200, after: 100 },
                            }),
                            new Paragraph({
                                children: [
                                    new TextRun({ text: "שפות: ", bold: true }),
                                    new TextRun("C#, JavaScript, TypeScript"),
                                ],
                                spacing: { after: 100 },
                            }),
                            new Paragraph({
                                children: [
                                    new TextRun({ text: "צד-לקוח: ", bold: true }),
                                    new TextRun("React, Angular, Redux, HTML5, CSS3, Sass"),
                                ],
                                spacing: { after: 100 },
                            }),
                            new Paragraph({
                                children: [
                                    new TextRun({ text: "צד-שרת: ", bold: true }),
                                    new TextRun(".NET, Node.js"),
                                ],
                                spacing: { after: 100 },
                            }),
                            new Paragraph({
                                children: [
                                    new TextRun({ text: "בסיסי נתונים: ", bold: true }),
                                    new TextRun("SQL, NoSQL, Entity Framework"),
                                ],
                                spacing: { after: 100 },
                            }),
                            new Paragraph({
                                children: [
                                    new TextRun({ text: "מתודולוגיות: ", bold: true }),
                                    new TextRun("OOP, MVC, CDD, SPA, פיתוח ריאקטיבי (RxJs)"),
                                ],
                                spacing: { after: 300 },
                            }),

                            // השכלה
                            new Paragraph({
                                text: "השכלה והסמכות",
                                heading: HeadingLevel.HEADING_2,
                                border: { bottom: { size: 12, value: "auto", color: "000000" } },
                                spacing: { before: 200, after: 100 },
                            }),
                            new Paragraph({
                                children: [
                                    new TextRun({ text: "מכללת ג'ון ברייס:", bold: true }),
                                    new TextRun(" מצטיין קורס .Net 4.5 Framework"),
                                ],
                                spacing: { after: 100 },
                            }),
                            new Paragraph({
                                children: [
                                    new TextRun({ text: "רשות התקשוב הממשלתית:", bold: true }),
                                    new TextRun(" קורס Angular מתקדם"),
                                ],
                                spacing: { after: 100 },
                            }),
                            new Paragraph({
                                children: [
                                    new TextRun({ text: "האוניברסיטה העברית:", bold: true }),
                                    new TextRun(" מכינה קדם אקדמית, סיום בממוצע 92.2"),
                                ],
                                spacing: { after: 300 },
                            }),
                        ],
                    },
                ],
            });

            Packer.toBlob(doc).then((blob) => {
                saveAs(blob, "קורות חיים - יותם חסין (משופר).docx");
            });
        }

        const button = document.getElementById("generateCVButton");
        button.addEventListener("click", createCV);
    </script>

</body>

</html>
